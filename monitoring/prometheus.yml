global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Метрики FastAPI inference-сервиса (llm_requests_total, llm_request_latency_seconds, ...)
  - job_name: inference-service
    static_configs:
      - targets: ["inference:8080"]

  # Самомониторинг Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
