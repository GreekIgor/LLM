# HW9: MLflow + Inference Service + Prometheus в Docker Compose.
# Бэкенд инференса — OpenRouter (OpenAI-совместимый API) как замена vLLM:
# локальный vLLM невозможен на этом железе (GPU Pascal SM 6.1 < требуемых 7.5).
# Ключ OPENROUTER_API_KEY подхватывается из .env.
#
# Запуск:
#   docker compose up --build

services:
  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  inference:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # OpenRouter как OpenAI-совместимый бэкенд (inference добавит /v1/completions)
      VLLM_BASE_URL: "https://openrouter.ai/api"
      VLLM_API_KEY: "${OPENROUTER_API_KEY}"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_EXPERIMENT: "vllm-inference"
      DEFAULT_MODEL: "qwen/qwen-2.5-7b-instruct"
      LOG_PROMPTS: "false"
      PORT: "8080"
      HOST: "0.0.0.0"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - inference
    restart: unless-stopped

volumes:
  mlflow-data:
  prometheus-data:
